name: Build Enclave Image Chain

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release name
        required: true
        default: tahoe
        type: choice
        options:
          - tahoe
          - sequoia
          - sonoma
      xcode_version:
        description: Exact Xcode version already present in ~/XcodesCache
        required: true
        type: string
      publish:
        description: Push Enclave-owned OCI images after acceptance
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  attestations: read

concurrency:
  group: enclave-macos-image-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64, enclave-image-builder]
    timeout-minutes: 360
    environment: macos-image-release
    env:
      MACOS_VERSION: ${{ inputs.macos_version }}
      XCODE_VERSION: ${{ inputs.xcode_version }}
      TART_REGISTRY_HOSTNAME: ghcr.io
      TART_REGISTRY_USERNAME: ${{ github.actor }}
      TART_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.ENCLAVE_INFRA_READ_TOKEN }}
      CREATED_VMS_FILE: ${{ runner.temp }}/enclave-created-vms-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify pinned builder tools
        run: |
          set -euo pipefail
          test "$(tart --version)" = "2.34.0"
          packer version
          scripts/validate-enclave-boundary.sh
      - name: Fetch signed Enclave guest artifacts
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          gh release download \
            --repo enclave-run/infra \
            --pattern 'sbxd-darwin' \
            --pattern 'enclave-guest-bootstrap' \
            --pattern 'enclave-macos-ui' \
            --pattern 'SHA256SUMS' \
            --dir .artifacts
          scripts/verify-release-artifacts.sh "$PWD/.artifacts"
          for artifact in sbxd-darwin enclave-guest-bootstrap enclave-macos-ui; do
            gh attestation verify ".artifacts/$artifact" \
              --repo enclave-run/infra
          done
      - name: Build and accept full chain
        run: |
          scripts/build-chain.sh \
            "$MACOS_VERSION" \
            "$XCODE_VERSION" \
            "$PWD/.artifacts/sbxd-darwin" \
            "$PWD/.artifacts/enclave-guest-bootstrap" \
            "$PWD/.artifacts/enclave-macos-ui" \
            "$CREATED_VMS_FILE"
      - name: Publish Enclave-owned images
        if: inputs.publish
        run: |
          set -euo pipefail
          tart push "$MACOS_VERSION-vanilla" \
            "ghcr.io/enclave-run/macos-$MACOS_VERSION-vanilla:${GITHUB_SHA}"
          tart push "$MACOS_VERSION-base" \
            "ghcr.io/enclave-run/macos-$MACOS_VERSION-base:${GITHUB_SHA}"
          tart push "$MACOS_VERSION-xcode:$XCODE_VERSION" \
            "ghcr.io/enclave-run/macos-$MACOS_VERSION-xcode:${GITHUB_SHA}"
      - name: Cleanup build VMs
        if: always()
        run: |
          scripts/cleanup-created-vms.sh "$CREATED_VMS_FILE"
          rm -rf "$GITHUB_WORKSPACE/.artifacts"
